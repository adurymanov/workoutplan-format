name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema:
    name: JSON Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python3 scripts/validate.py

  swift:
    name: Swift
    # WorkoutKit is available in the macOS SDK, so the mapping layer and its
    # tests run here without a simulator.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
